name: Claude Code Agent

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  id-token: write      # Required for secure OIDC token exchange
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude_run:
    if: |
      (github.event_name == 'pull_request' && github.actor == 'codebreaker32') || 
      (github.event_name == 'issue_comment' && github.actor == 'codebreaker32' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
